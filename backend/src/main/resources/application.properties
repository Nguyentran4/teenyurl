spring.application.name=demo
spring.datasource.url=${TEENYURL_DATABASE_URL:jdbc:postgresql://localhost:5432/teenyurl}
spring.datasource.username=${TEENYURL_DATABASE_USERNAME:teenyurl}
spring.datasource.password=${TEENYURL_DATABASE_PASSWORD:teenyurl}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=${TEENYURL_JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
