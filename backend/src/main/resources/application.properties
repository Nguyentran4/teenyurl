spring.application.name=demo
server.port=${PORT:${SERVER_PORT:8080}}
spring.datasource.url=${SPRING_DATASOURCE_URL:${TEENYURL_DATABASE_URL:jdbc:postgresql://localhost:5432/teenyurl}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${TEENYURL_DATABASE_USERNAME:teenyurl}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${TEENYURL_DATABASE_PASSWORD:change-me-local-only}}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=${TEENYURL_JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.repositories.enabled=false

teenyurl.cache.redis.enabled=${TEENYURL_CACHE_REDIS_ENABLED:true}
teenyurl.cache.redirect.key-prefix=${TEENYURL_REDIS_REDIRECT_KEY_PREFIX:url:}
teenyurl.cache.redirect.default-ttl=${TEENYURL_REDIS_REDIRECT_TTL:PT1H}

teenyurl.analytics.ip-hash-salt=${TEENYURL_ANALYTICS_IP_HASH_SALT:replace-with-local-dev-salt}

teenyurl.rate-limit.create.enabled=${TEENYURL_RATE_LIMIT_CREATE_ENABLED:true}
teenyurl.rate-limit.create.limit=${TEENYURL_RATE_LIMIT_CREATE_LIMIT:10}
teenyurl.rate-limit.create.window=${TEENYURL_RATE_LIMIT_CREATE_WINDOW:PT1M}
teenyurl.rate-limit.redirect.enabled=${TEENYURL_RATE_LIMIT_REDIRECT_ENABLED:false}
teenyurl.rate-limit.redirect.limit=${TEENYURL_RATE_LIMIT_REDIRECT_LIMIT:120}
teenyurl.rate-limit.redirect.window=${TEENYURL_RATE_LIMIT_REDIRECT_WINDOW:PT1M}
teenyurl.rate-limit.redis.enabled=${TEENYURL_RATE_LIMIT_REDIS_ENABLED:true}
teenyurl.rate-limit.redis.key-prefix=${TEENYURL_RATE_LIMIT_REDIS_KEY_PREFIX:rate_limit:}

teenyurl.logging.request.enabled=${TEENYURL_REQUEST_LOGGING_ENABLED:true}
teenyurl.short-code.snowflake.node-id=${TEENYURL_SHORT_CODE_NODE_ID:0}
teenyurl.short-code.snowflake.epoch-millis=${TEENYURL_SHORT_CODE_EPOCH_MILLIS:1735689600000}
teenyurl.security.create-api-key=${TEENYURL_CREATE_API_KEY:}
teenyurl.security.allow-private-redirect-targets=${TEENYURL_ALLOW_PRIVATE_REDIRECT_TARGETS:false}
teenyurl.cors.allowed-origins=${TEENYURL_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,https://teenyurl-frontend.example.com}
