services:
  postgres:
    image: postgres:16-alpine
    container_name: teenyurl-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-teenyurl}
      POSTGRES_USER: ${POSTGRES_USER:-teenyurl}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-teenyurl}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - teenyurl-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-teenyurl} -d ${POSTGRES_DB:-teenyurl}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  teenyurl-postgres-data:
